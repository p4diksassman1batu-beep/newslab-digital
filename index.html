<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NewsLab Digital – Modul Interaktif Teks Berita Aktual dan Akurat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --outer:#dfe8fb; --paper:#eef3ff; --card:#ffffff; --ink:#27245f; --ink2:#4a4a7a; --line:#c9d3f2;
  --navy:#2a2760; --primary:#5b2be0; --primary2:#7c4dff; --orange:#ff9f1c; --red:#e63946; --blue:#3b9ae8;
  --ok:#1f9d55; --okbg:#dff5e8; --no:#d33a4a; --nobg:#fde3e6; --soft:#e4e9fb;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --outer:#0f0e26; --paper:#1a1941; --card:#252360; --ink:#eeecff; --ink2:#bdbbe6; --line:#3b3a86; --soft:#2f2d73;
    --okbg:#133a27; --nobg:#4a1e28; --ok:#5fdc93; --no:#ff8b97;
  }
}
:root[data-theme="dark"]{
  --outer:#0f0e26; --paper:#1a1941; --card:#252360; --ink:#eeecff; --ink2:#bdbbe6; --line:#3b3a86; --soft:#2f2d73;
  --okbg:#133a27; --nobg:#4a1e28; --ok:#5fdc93; --no:#ff8b97;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;background:var(--outer)}
body{min-height:100%;height:100%;display:grid;place-items:center;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);
  background:var(--outer) repeating-linear-gradient(115deg,transparent 0 22px,rgba(91,43,224,.05) 22px 24px)}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* ===== Buku 4:5 ===== */
.book{position:relative;width:min(100vw,calc(100vh*0.8));width:min(100vw,calc(100dvh*0.8));aspect-ratio:4/5;container-type:inline-size;
  background:var(--paper);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(42,39,96,.25);border-radius:0}
@media (min-width:700px){.book{border-radius:22px}}
.prog{height:5px;background:var(--soft);flex:none}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--orange));transition:width .3s}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4cqw 5.5cqw 6cqw;font-size:clamp(12.5px,3.1cqw,17px);line-height:1.55;scroll-behavior:smooth;
  background-image:repeating-linear-gradient(115deg,transparent 0 26px,rgba(91,43,224,.04) 26px 28px)}
.nav{flex:none;background:var(--navy);color:#fff;display:flex;align-items:center;gap:2cqw;padding:1.8cqw 3cqw;font-size:clamp(11px,2.8cqw,15px)}
.nav button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:.55em 1.1em;cursor:pointer;font-weight:600;white-space:nowrap}
.nav button:hover:not(:disabled){background:var(--primary2)}
.nav button:disabled{opacity:.35;cursor:default}
.nav .mid{flex:1;text-align:center;font-weight:500;opacity:.9;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== Tipografi & komponen ===== */
h1,h2,h3,h4{margin:0;line-height:1.15}
.big{font-weight:800;font-size:clamp(30px,10.5cqw,70px);letter-spacing:-.02em;line-height:1.02;color:var(--navy)}
:root[data-theme="dark"] .big,:root:not([data-theme="light"]) .big{color:var(--ink)}
.big.p{color:var(--primary)}
.h2{font-size:clamp(18px,5.4cqw,32px);font-weight:800;color:var(--navy);letter-spacing:-.01em}
:root[data-theme="dark"] .h2{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .h2{color:var(--ink)}}
.h3{font-size:1.15em;font-weight:700;margin:1.1em 0 .4em;color:var(--primary)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .h3{color:#b9a5ff}}
:root[data-theme="dark"] .h3{color:#b9a5ff}
.sub{font-style:italic;font-weight:700;font-size:clamp(15px,4.4cqw,26px);color:var(--ink);line-height:1.25}
.lead{color:var(--ink2);margin:.3em 0 .8em}
p{margin:.5em 0}
ul,ol{padding-left:1.3em;margin:.4em 0}
li{margin:.25em 0}
.tab{display:inline-block;background:var(--primary);color:#fff;font-weight:700;border-radius:12px;padding:.35em 1.1em;margin:.9em 0 .5em;font-size:1.02em}
.chip{display:inline-block;background:var(--soft);color:var(--ink);border-radius:999px;padding:.1em .75em;font-size:.82em;font-weight:600;margin:.1em .15em .1em 0}
.dark{background:var(--navy);color:#fff;border:3px solid var(--primary);border-radius:14px;padding:.9em 1.1em;margin:.8em 0}
.dark b{color:#ffd37a}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:.7em 1em;margin:.8em 0}
.card.o{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 12%,var(--card))}
.card.b{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--card))}
.card.g{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.card .t{font-weight:800;margin-bottom:.15em}
.card.o .t{color:#d97b00}.card.b .t{color:var(--blue)}.card.g .t{color:var(--ok)}
.btn{display:inline-block;border:0;border-radius:12px;padding:.65em 1.3em;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;text-decoration:none;font-size:1em;transition:transform .12s,background .12s}
.btn:hover{background:var(--primary2);transform:translateY(-1px)}
.btn.red{background:var(--red);border:3px solid #ff9aa2;letter-spacing:.01em}
.btn.red:hover{background:#ff4d5a}
.btn.ghost{background:transparent;color:var(--primary);border:2px solid var(--primary)}
.btn.sm{padding:.4em .9em;font-size:.88em}
.row{display:flex;flex-wrap:wrap;gap:.5em;margin:.6em 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em}
.tbl{width:100%;border-collapse:collapse;margin:.6em 0;font-size:.93em;background:var(--card);border-radius:10px;overflow:hidden}
.tbl th{background:var(--navy);color:#fff;padding:.5em .6em;text-align:left;font-weight:600}
.tbl td{padding:.45em .6em;border:1px solid var(--line);vertical-align:top}
.tbl tr:nth-child(even) td{background:color-mix(in srgb,var(--soft) 45%,var(--card))}
.wrap{overflow-x:auto;margin:.4em 0}
.wrap .tbl{min-width:420px}
textarea,input[type=text]{width:100%;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:.5em .7em;resize:vertical;min-height:2.6em}
textarea:focus,input:focus{border-color:var(--primary);outline:none}
.tbl textarea,.tbl input[type=text]{border-width:1px;min-height:2.2em;font-size:.95em}
.fl{display:block;font-weight:600;margin:.6em 0 .2em}
.fl textarea,.fl input{font-weight:400;margin-top:.25em}
.ck{display:flex;gap:.6em;align-items:flex-start;margin:.35em 0;cursor:pointer}
.ck input{margin-top:.35em;accent-color:var(--primary);width:1.1em;height:1.1em;flex:none}
.vid{display:flex;gap:.9em;align-items:flex-start;background:var(--card);border:2px solid var(--blue);border-radius:16px;padding:.8em;margin:.8em 0}
.vid .pl{flex:none;width:3.4em;height:3.4em;border-radius:14px;background:var(--red);display:grid;place-items:center;color:#fff;font-size:1.3em;text-decoration:none;box-shadow:0 3px 0 #a91d29}
.vid .pl:hover{background:#ff4d5a}
.vid b{display:block;line-height:1.3}
.vid small{display:block;color:var(--ink2);margin:.2em 0}
.vid ul{margin:.2em 0 0;font-size:.92em}
.sticker{font-size:clamp(34px,11cqw,64px);line-height:1}
.hl{border-radius:6px;padding:0 .15em;transition:background .2s}
.hl-kepala.on{background:#bfe3ff}.hl-leher.on{background:#d9c8ff}.hl-tubuh.on{background:#ffe3a8}.hl-kaki.on{background:#ffc9c9}
:root[data-theme="dark"] .hl.on,:root:not([data-theme="light"]) .hl.on{color:#1d1b4b}
.ill{display:block;margin-top:.4em;font-size:.82em;color:var(--ink2)}
.art{background:var(--card);border-left:6px solid var(--primary);border-radius:10px;padding:.8em 1em;margin:.8em 0}
.art h4{font-size:1.1em;margin-bottom:.2em}
.meta{font-size:.82em;color:var(--ink2);margin-bottom:.5em}

/* piramida */
.pyr{display:flex;flex-direction:column;align-items:center;gap:.35em;margin:.8em 0}
.pyr button{border:0;color:#fff;font-weight:700;padding:.65em .5em;cursor:pointer;border-radius:10px;clip-path:polygon(4% 0,96% 0,100% 100%,0 100%);transition:transform .15s,filter .15s}
.pyr button:hover,.pyr button.on{transform:scale(1.03);filter:brightness(1.12)}
.pyr button.on{outline:3px solid var(--orange)}
.pyr small{display:block;font-weight:400;font-size:.8em}
.pinfo{min-height:4.5em}
.axis{text-align:center;font-size:.82em;color:var(--ink2)}

/* kartu balik */
.flip{border:2px solid var(--primary);background:var(--card);border-radius:16px;padding:.7em;cursor:pointer;text-align:left;min-height:7.2em;transition:background .2s}
.flip .f{font-size:1.5em;font-weight:800;color:var(--primary)}
.flip .f small{display:block;font-size:.5em;font-weight:600;color:var(--ink2)}
.flip .bk{display:none;font-size:.9em}
.flip.open{background:var(--primary);color:#fff}
.flip.open .f{display:none}.flip.open .bk{display:block}
.flip.open .bk b{color:#ffd37a}

/* akordeon */
.acc{background:var(--card);border:2px solid var(--line);border-radius:14px;margin:.5em 0;overflow:hidden}
.acc>button{width:100%;text-align:left;background:none;border:0;padding:.7em 1em;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:.5em}
.acc>button::after{content:"＋";color:var(--primary);font-weight:800}
.acc.open>button::after{content:"－"}
.acc .bd{display:none;padding:0 1em .8em}
.acc.open .bd{display:block}
.acc.open{border-color:var(--primary)}

/* pilihan cepat */
.mq{margin:.7em 0}
.mq .opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:.55em .9em;margin:.35em 0;cursor:pointer;line-height:1.4}
.mq .opt:hover:not(:disabled){border-color:var(--primary)}
.mq .opt.ok{background:var(--okbg);border-color:var(--ok)}
.mq .opt.no{background:var(--nobg);border-color:var(--no)}
.fb{display:none;margin:.4em 0;padding:.55em .9em;border-radius:12px;background:var(--soft);font-size:.93em}
.fb.show{display:block}
.rev{display:none}.rev.show{display:block}

/* sampul */
.cover{display:flex;flex-direction:column;min-height:100%}
.logo{display:inline-flex;align-items:center;gap:.6em;background:var(--card);border-radius:12px;padding:.5em .9em;font-weight:800;box-shadow:0 3px 12px rgba(42,39,96,.15);color:var(--navy);font-size:.95em}
:root[data-theme="dark"] .logo{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{color:var(--ink)}}
.ring{width:23cqw;height:23cqw;border-radius:50%;background:conic-gradient(var(--primary) 0 25%,var(--orange) 0 50%,var(--blue) 0 75%,var(--red) 0);display:grid;place-items:center;flex:none;box-shadow:0 4px 16px rgba(42,39,96,.25)}
.ring span{width:76%;height:76%;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-weight:800;font-size:2.7cqw;color:var(--navy);line-height:1.15;padding:.3em}
:root[data-theme="dark"] .ring span{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ring span{color:var(--ink)}}
.cover .top{display:flex;justify-content:space-between;align-items:flex-start;gap:1em}
.star{position:absolute;right:6cqw;top:45%;color:var(--orange);font-size:9cqw;font-weight:800}
.books{font-size:clamp(50px,18cqw,110px);line-height:1;text-align:center}
.cta{margin-top:auto;padding-top:.6em;text-align:center}
.foot{margin:1em -5.5cqw -6cqw;background:var(--navy);color:#fff;padding:.8em 5.5cqw;display:flex;justify-content:space-between;gap:1em;font-size:.78em}
.foot b{display:block}

/* menu */
.drawer{position:absolute;inset:0;background:var(--paper);z-index:5;display:none;flex-direction:column}
.drawer.open{display:flex}
.drawer header{background:var(--navy);color:#fff;padding:.9em 1.2em;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.drawer header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:999px;padding:.35em .9em;cursor:pointer}
.drawer .lst{overflow:auto;padding:1em 1.2em;font-size:clamp(12.5px,3.1cqw,16px)}
.drawer .grp{font-weight:800;color:var(--primary);margin:.9em 0 .3em}
.drawer .lst button{display:flex;gap:.6em;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:.45em .8em;margin:.25em 0;cursor:pointer}
.drawer .lst button.cur{border-color:var(--primary);background:var(--soft)}
.peta{display:grid;grid-template-columns:1fr 1fr;gap:.7em;margin:.8em 0}
.peta button{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:.8em;text-align:left;cursor:pointer;transition:transform .12s,border-color .12s}
.peta button:hover{transform:translateY(-2px);border-color:var(--primary)}
.peta .e{font-size:1.8em;display:block}
.peta b{display:block;color:var(--primary)}
.peta small{color:var(--ink2)}

/* kuis */
.qno{font-weight:700;color:var(--primary)}
.qbar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:.4em 0 .8em}
.qbar i{display:block;height:100%;background:var(--primary)}
.score{text-align:center;padding:1em 0}
.score .n{font-size:clamp(40px,14cqw,80px);font-weight:800;color:var(--primary);line-height:1}
.qtext{background:var(--card);border-left:5px solid var(--orange);padding:.6em .9em;border-radius:8px;margin:.5em 0;font-style:italic}
.toast{position:absolute;left:50%;bottom:14cqw;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.5em 1em;border-radius:99px;font-size:.85em;opacity:0;pointer-events:none;transition:opacity .25s;z-index:6}
.toast.show{opacity:1}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.peta{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="book" id="book">
  <div class="prog"><i id="prog"></i></div>
  <div class="scroll" id="scroll" tabindex="-1"></div>
  <nav class="nav" aria-label="Navigasi modul">
    <button id="prev" aria-label="Halaman sebelumnya">◀ Balik</button>
    <button id="menuBtn" aria-label="Buka daftar isi">☰ Isi</button>
    <div class="mid" id="mid"></div>
    <button id="next" aria-label="Halaman berikutnya">Lanjut ▶</button>
  </nav>
  <div class="drawer" id="drawer">
    <header><span>📚 Daftar Isi NewsLab</span><button id="closeMenu">Tutup ✕</button></header>
    <div class="lst" id="lst"></div>
  </div>
  <div class="toast" id="toast">Jawabanmu tersimpan ✓</div>
</main>

<script>
/* ===== Penyimpanan jawaban (aman bila storage kosong/ditolak) ===== */
var STORE='newslab-xi-v1', state={};
try{ state=JSON.parse(localStorage.getItem(STORE)||'{}')||{}; }catch(e){ state={}; }
function persist(){ try{ localStorage.setItem(STORE,JSON.stringify(state)); }catch(e){} }

/* ===== Helper pembuat HTML ===== */
function ta(id,label,rows){ return '<label class="fl">'+label+'<textarea data-save="'+id+'" rows="'+(rows||2)+'"></textarea></label>'; }
function inp(id,label){ return '<label class="fl">'+label+'<input type="text" data-save="'+id+'"></label>'; }
function cell(id,rows){ return '<textarea data-save="'+id+'" rows="'+(rows||2)+'" aria-label="isian"></textarea>'; }
function ck(id,label){ return '<label class="ck"><input type="checkbox" data-save="'+id+'"><span>'+label+'</span></label>'; }
function tbl(h,rows){ return '<div class="wrap"><table class="tbl"><thead><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'; }
function vid(title,url,notes,label){
  return '<div class="vid"><a class="pl" href="'+url+'" target="_blank" rel="noopener" aria-label="Buka video: '+title+'">▶</a><div><b>'+title+'</b><small>'+(label||'Ayo Menonton')+' · <a href="'+url+'" target="_blank" rel="noopener">'+url.replace('https://','')+'</a></small>'+(notes?'<b style="font-size:.9em;margin-top:.3em">Sambil menonton, catatlah:</b><ul>'+notes.map(function(n){return '<li>'+n+'</li>'}).join('')+'</ul>':'')+'</div></div>';
}
function acc(t,b,open){ return '<div class="acc'+(open?' open':'')+'"><button data-act="acc" aria-expanded="false">'+t+'</button><div class="bd">'+b+'</div></div>'; }
function mq(q,opts,exp){ return '<div class="mq" data-exp="'+exp.replace(/"/g,'&quot;')+'"><p><b>'+q+'</b></p>'+opts.map(function(o){return '<button class="opt" data-act="mq" data-c="'+(o[1]?1:0)+'">'+o[0]+'</button>'}).join('')+'<div class="fb"></div></div>'; }
function rev(label,body){ return '<button class="btn ghost sm" data-act="rev">'+label+'</button><div class="rev card g" style="margin-top:.5em">'+body+'</div>'; }
function rubrik(title,heads,rows,crit){ return acc('📊 '+title, tbl(heads,rows)+(crit||'')); }
function banner(e,t,s){ return '<div style="display:flex;gap:.7em;align-items:center;margin-bottom:.6em"><span class="sticker">'+e+'</span><div><div class="h2">'+t+'</div>'+(s?'<div class="lead" style="margin:0">'+s+'</div>':'')+'</div></div>'; }
function goBtn(id,label){ return '<button class="btn sm" data-go="'+id+'">'+label+'</button>'; }

/* ===== Halaman-halaman modul ===== */
var P=[];
function add(id,grp,title,html){ P.push({id:id,grp:grp,title:title,html:html}); }

/* 1. Sampul */
add('cover','Mulai','Sampul',
'<div class="cover">'+
 '<div class="top"><div><span class="logo">📰 NewsLab&nbsp;Digital</span><div style="margin-top:.5em"><span class="chip">Bahasa Indonesia</span><span class="chip">Kelas XI · Fase F</span></div></div>'+
 '<div class="ring"><span>TEKS<br>BERITA<br>5W+1H</span></div></div>'+
 '<h1 class="big" style="margin-top:.5em">Modul Interaktif</h1>'+
 '<h1 class="big p">Teks Berita</h1>'+
 '<p class="sub" style="margin:.6em 0 .2em">Aktual &amp; Akurat, Siap Jadi Reporter!</p>'+
 '<div class="dark" style="margin-top:.7em">Belajar teks berita lewat <b>menyimak, membaca, menulis,</b> dan <b>berbicara</b>. Di akhir, kamu bikin <b>teks berita</b> dan <b>video reporter digital</b> bareng timmu. Seru dan gampang diikuti!</div>'+
 '<div class="row" style="justify-content:space-between;align-items:flex-end"><div class="card" style="flex:1;min-width:0;margin:0"><div class="t" style="font-weight:800;color:var(--primary)">Isi Modul</div><ul style="font-size:.9em"><li>Materi singkat + kegiatan interaktif</li><li>Video menyimak (link YouTube)</li><li>LKPD yang bisa diisi langsung</li><li>25 soal kuis dengan pembahasan</li></ul></div><div class="books">📚</div></div>'+
 '<div class="cta"><button class="btn red" data-go="peta" style="font-size:1.1em">MULAI BELAJAR!</button></div>'+
 '<div class="foot"><div><b>Model: Project Based Learning</b>Produk akhir: teks berita &amp; video reporter</div><div style="text-align:right"><b>Based on Education Research</b>NewsLab Digital</div></div>'+
'</div><div class="star" aria-hidden="true">✱</div>');

/* 2. Peta */
add('peta','Mulai','Peta Petualangan',
 banner('🗺️','Peta Petualangan','Pilih jalurmu, atau ikuti urutannya.')+
 '<div class="peta">'+
 '<button data-go="definisi"><span class="e">📖</span><b>Materi</b><small>Definisi, struktur, 5W+1H, kaidah, aktual &amp; akurat</small></button>'+
 '<button data-go="menyimak"><span class="e">🎧</span><b>Menyimak</b><small>Nonton berita, temukan 5W+1H</small></button>'+
 '<button data-go="membaca"><span class="e">👓</span><b>Membaca</b><small>Bedah struktur &amp; bahasa berita</small></button>'+
 '<button data-go="menulis"><span class="e">✍️</span><b>Menulis</b><small>Jadi wartawan &amp; editor</small></button>'+
 '<button data-go="berbicara"><span class="e">🎤</span><b>Berbicara</b><small>Bikin vlog berita</small></button>'+

add('definisi','Materi','A. Definisi Teks Berita',

 '<p>Banjir, pertandingan olahraga, atau kasus kriminal, semua kabar itu kita terima dalam bentuk <b>berita</b>. Berita adalah laporan tentang peristiwa atau fakta yang <b>aktual, menarik, dan bermanfaat</b>, disampaikan lewat media massa: surat kabar, majalah, radio, televisi, dan media daring.</p>'+
 '<div class="card b"><div class="t">Teks berita</div>Teks yang berisi informasi tentang peristiwa yang sedang atau baru saja terjadi. Ditulis dengan bahasa jurnalistik dan disusun berdasarkan struktur tertentu.</div>'+
 '<h3 class="h3">Ciri-ciri berita</h3>'+
 '<div class="grid2"><div class="card" style="margin:0"><b>✅ Faktual</b><br>Peristiwanya benar-benar terjadi.</div><div class="card" style="margin:0"><b>⏱️ Aktual</b><br>Baru terjadi atau sedang berlangsung.</div><div class="card" style="margin:0"><b>⭐ Penting &amp; menarik</b><br>Bermanfaat dan menarik banyak orang.</div><div class="card" style="margin:0"><b>📡 Lewat media massa</b><br>Sampai ke khalayak luas.</div></div>'+
 '<p>Berita ditulis dengan informasi yang logis, singkat, padat, dan jelas. Wartawan <b>tidak boleh menambahkan dugaan atau pendapat pribadi</b>. Kalau ingin menyampaikan pandangan seseorang, pandangan itu harus dikutip dan disebutkan siapa yang mengatakannya. Ini disebut <b>atribusi</b>.</p>'+
 '<p>Beda dengan berita: tajuk rencana, artikel opini, dan surat pembaca berisi <i>pendapat</i> penulis, sedangkan iklan dibuat untuk kepentingan pemasang.</p>'+
 '<h3 class="h3">Kenapa suatu peristiwa dijadikan berita? (Nilai berita)</h3>'+

 '<p>Berita yang baik wajib menjawab <b>enam pertanyaan dasar</b>: <i>what, who, where, when, why,</i> dan <i>how</i>. Dalam bahasa Indonesia disingkat <b>ADIKSIMBA</b>: <b>A</b>pa, <b>DI</b>mana, <b>K</b>apan, <b>SI</b>apa, <b>M</b>engapa, <b>BA</b>gaimana.</p>'+

 '<p style="margin-top:.8em">Kalau satu unsur hilang, pembaca sulit paham utuh. Misalnya berita yang hanya berbunyi <i>“Terjadi kebakaran”</i> belum menyebut siapa yang terlibat, di mana, dan kapan.</p>'+
 '<p>Keenamnya saling melengkapi. <b>Apa, siapa, di mana, kapan</b> menjawab <i>kenyataan</i> peristiwa, sedangkan <b>mengapa dan bagaimana</b> menjawab <i>sebab dan proses</i>. Berita yang cuma memuat empat unsur pertama terasa datar, sebab pembaca tahu apa yang terjadi tetapi tidak tahu kenapa.</p>'+

 '<p><b>TRIBUNJATIM.COM, BATU</b> - Wisatawan asal Rusia, Aleksandr Popov (35), tersangkut di pohon pinus setinggi sekitar 20 meter di Desa Gunungsari, Kecamatan Bumiaji, Kota Batu, Jawa Timur, Selasa (25/8/2026).</p>'+
 '<p>Aleksandr mengalami insiden tersebut setelah melakukan aktivitas paralayang dari kawasan Gunung Banyak, Desa Songgokerto, Kota Batu, pada Selasa sore.</p>'+
 '<p>Kepala Kantor SAR Kelas A Surabaya, Nanang Sigit, mengatakan tim SAR menerima laporan dari personel BPBD Kota Batu mengenai seorang paraglider asing yang mengalami masalah dan tersangkut di pohon.</p>'+
 '<p>Satu tim rescue Unit Siaga SAR Malang Raya kemudian dikerahkan bersama BPBD Kota Batu, pengelola wisata paralayang, dan warga sekitar untuk melakukan evakuasi.</p>'+
 '<p>“Yang bersangkutan berhasil dievakuasi oleh tim SAR gabungan dari atas pohon pinus dalam kondisi selamat, dan tidak ditemukan cedera setelah personel medis melakukan pemeriksaan,” kata Nanang Sigit, Rabu (26/8/2026).</p>'+
 '<p>Proses evakuasi berlangsung sekitar dua jam. Kondisi medan yang sulit serta posisi korban yang berada di atas pohon dengan masih mengenakan peralatan paralayang membuat proses penyelamatan harus dilakukan secara hati-hati.</p>'+
 '<p>“Sesampainya di lokasi tim SAR gabungan melakukan asesmen untuk menentukan metode yang aman dalam menurunkan korban. Kondisi medan dan posisi korban yang berada di atas pohon membuat tim SAR gabungan melakukan penanganan dengan hati-hati,” jelasnya.</p>'+
 '<p>Setelah menentukan metode penyelamatan yang aman, tim SAR gabungan selanjutnya menyiapkan peralatan vertical rescue guna mengevakuasi korban dengan metode lowering. Dengan metode ini, korban diturunkan bertahap dari ketinggian dengan sistem tali dan perangkat keselamatan.</p>'+
 '<p>Sementara itu Koordinator Unit Siaga SAR Malang Raya, Imam Nahrowi menjelaskan korban berhasil dievakuasi pada pukul 22.00 WIB dan langsung menjalani pemeriksaan medis.</p>'+

var Q=[
 {q:'<div class="qtext">Berita A: kegiatan penghijauan di Kota Batu dilaksanakan 7 September 2026 dan diberitakan hari yang sama.<br>Berita B: kegiatan yang sama, tetapi baru diberitakan 20 September 2026.</div>Jika kedua berita membahas peristiwa yang sama dan sama benarnya, kesimpulan paling tepat adalah ….',o:['Berita B lebih aktual karena informasinya lebih lengkap','Berita A lebih aktual karena waktu publikasinya lebih dekat dengan peristiwa','Berita A lebih akurat karena diterbitkan lebih cepat','Berita B lebih akurat karena jarak waktu publikasinya lebih panjang'],a:1,e:'Keaktualan diukur dari dekatnya waktu publikasi dengan peristiwa. Kecepatan terbit tidak menentukan keakuratan.'},
 {q:'Sebuah akun media sosial mengunggah informasi tentang fenomena alam tak biasa di Kota Batu. Unggahan dibuat lima menit lalu, tetapi tanpa sumber, data, narasumber, atau bukti. Penilaian paling tepat ….',o:['Pasti akurat karena baru dipublikasikan','Tidak aktual karena belum diberitakan media massa','Aktual, tetapi keakuratannya masih perlu diperiksa','Akurat karena sudah tersebar luas di media sosial'],a:2,e:'Baru diunggah berarti aktual, tetapi tanpa sumber dan bukti keakuratannya belum terjamin. Viral ≠ benar.'},
 {q:'<div class="qtext">“Sebanyak 72 anggota Paskibraka Kota Batu Tahun 2026 resmi purnatugas setelah melaksanakan tugas dalam rangkaian peringatan kemerdekaan.”</div>Jika kutipan itu dipakai untuk menilai keakuratan berita, unsur yang paling perlu dicari adalah ….',o:['Judul berita','Sumber dan narasumber yang mendukung data tersebut','Kata sifat yang digunakan penulis','Panjang pendeknya berita'],a:1,e:'Data angka (72 anggota) harus didukung sumber dan narasumber agar bisa dicek kebenarannya.'},
 {q:'Seorang siswa membaca berita bahwa kegiatan di Kota Batu diikuti 500 peserta. Berita lain dari sumber berbeda menyebut 350 orang. Keduanya terbit pada hari yang sama. Tindakan paling tepat siswa ….',o:['Memilih angka 500 karena lebih besar','Memilih berita dengan judul paling menarik','Melakukan cek silang terhadap sumber dan narasumber kedua berita','Menganggap kedua berita tidak aktual karena datanya berbeda'],a:2,e:'Data yang berbeda diselesaikan dengan cek silang sumber dan narasumber, bukan menebak.'},
 {q:'<div class="qtext">Wisatawan asal Rusia, Aleksandr Popov (35), tersangkut di pohon pinus setinggi sekitar 20 meter di Desa Gunungsari, Kecamatan Bumiaji, Kota Batu, Jawa Timur, Selasa (25/8/2026).</div>Alasan paling tepat kalimat itu disebut kepala berita adalah ….',o:['Memberikan pendapat penulis tentang peristiwa','Menyajikan informasi paling penting: apa, siapa, kapan, dan di mana','Menjelaskan seluruh kronologi secara rinci','Hanya memberi informasi tambahan setelah peristiwa selesai'],a:1,e:'Kepala berita memuat inti: apa, siapa, di mana, kapan.'},
 {q:'Jika kalimat pada soal nomor 5 dikembangkan menjadi paragraf yang menjelaskan proses penyelamatan, penyebab korban tersangkut, lama evakuasi, serta keterangan tim SAR, bagian itu termasuk ….',o:['Judul','Kepala berita','Tubuh berita','Kaki berita'],a:2,e:'Kronologi, sebab, proses, dan kutipan narasumber adalah isi tubuh berita.'},
 {q:'Perhatikan bagian berikut:<br>1. Informasi tambahan tentang kondisi korban setelah dievakuasi<br>2. Peristiwa utama dan identitas orang yang terlibat<br>3. Judul yang menggambarkan inti peristiwa<br>4. Kronologi dan keterangan narasumber<br>5. Konteks/informasi tambahan mengenai awal kejadian<br>Urutan struktur berita yang paling tepat ….',o:['3–2–5–4–1','2–3–5–1–4','3–5–2–4–1','2–5–3–4–1'],a:0,e:'Judul (3) → kepala (2) → leher (5) → tubuh (4) → kaki (1).'},
 {q:'<div class="qtext">Aleksandr mengalami insiden tersebut setelah melakukan aktivitas paralayang dari kawasan Gunung Banyak, Desa Songgokerto, Kota Batu, pada Selasa sore.</div>Kutipan itu termasuk leher berita karena ….',o:['berisi informasi tambahan yang memberi konteks setelah informasi utama','merupakan informasi paling penting yang harus di awal berita','berisi kesimpulan dari seluruh peristiwa','hanya berfungsi sebagai judul berita'],a:0,e:'Leher berita menjembatani kepala dan tubuh dengan memberi konteks tambahan.'},
 {q:'Sebuah berita berstruktur lengkap. Bagian akhirnya hanya menjelaskan bahwa setelah dievakuasi, korban diserahkan kepada pihak keluarga. Jika dihapus, inti peristiwa tetap dapat dipahami. Bagian itu adalah ….',o:['Kepala berita','Leher berita','Tubuh berita','Kaki berita'],a:3,e:'Kaki berita berisi informasi pelengkap yang boleh dipotong tanpa merusak pemahaman.'},
 {q:'<div class="qtext">Tim SAR menerima laporan mengenai wisatawan asing yang tersangkut di pohon. Tim kemudian melakukan asesmen dan mengevakuasi korban menggunakan metode lowering dengan sistem tali dan perangkat keselamatan.</div>Informasi ini paling kuat untuk menjawab unsur ….',o:['What','Why','How','When'],a:2,e:'Menjelaskan cara/proses penyelamatan = unsur How (bagaimana).'},
 {q:'<div class="qtext">Proses evakuasi berlangsung sekitar dua jam karena kondisi medan yang sulit.</div>Dikaitkan dengan 5W+1H, informasi itu terutama menunjukkan ….',o:['kapan dan mengapa','siapa dan di mana','apa dan siapa','di mana dan bagaimana'],a:0,e:'“Sekitar dua jam” = waktu/durasi (When); “karena medan sulit” = sebab (Why).'},
 {q:'Seorang siswa menemukan berita yang sudah menjelaskan apa, siapa, kapan, dan di mana, tetapi tidak menjelaskan penyebab peristiwa. Kelemahan berita itu ….',o:['unsur What belum lengkap','unsur Who belum lengkap','unsur Why belum ditemukan','unsur How sudah tidak diperlukan'],a:2,e:'Penyebab peristiwa dijawab oleh unsur Why (mengapa).'},
 {q:'<div class="qtext">Tim SAR melakukan evakuasi terhadap korban di Desa Gunungsari dengan hati-hati.</div>Kata <i>melakukan</i> dan frasa <i>dengan hati-hati</i> secara berurutan merupakan ….',o:['kata kerja dan keterangan cara','kata baku dan keterangan waktu','konjungsi dan keterangan tempat','kata kerja dan keterangan tempat'],a:0,e:'“Melakukan” = kata kerja; “dengan hati-hati” menerangkan cara.'},
 {q:'<div class="qtext">Korban mengalami masalah sehingga tersangkut di pohon.</div>Fungsi kata <i>sehingga</i> dalam kalimat itu ….',o:['menunjukkan tempat terjadinya peristiwa','menghubungkan informasi yang menunjukkan hubungan antarkejadian','menjelaskan identitas narasumber','menunjukkan waktu terjadinya peristiwa'],a:1,e:'“Sehingga” adalah konjungsi yang menghubungkan sebab-akibat antarkejadian.'},
 {q:'Kalimat yang paling sesuai dengan prinsip objektif dalam penulisan berita adalah ….',o:['Tim SAR yang luar biasa hebat itu berhasil menyelamatkan korban dengan sangat mengagumkan.','Beruntung sekali korban mendapatkan pertolongan dari tim SAR terbaik di Kota Batu.','Tim SAR berhasil mengevakuasi korban dalam kondisi selamat.','Korban pasti merasa sangat bahagia karena diselamatkan oleh tim SAR.'],a:2,e:'Hanya opsi C yang murni fakta, tanpa pujian, penilaian, atau dugaan perasaan.'},
 {q:'Seorang siswa mengubah <i>“Korban berhasil dievakuasi,” kata petugas.</i> menjadi <i>Petugas mengatakan bahwa korban berhasil dievakuasi.</i> Perubahan itu menunjukkan siswa telah mengubah ….',o:['kalimat baku menjadi tidak baku','kalimat langsung menjadi kalimat tidak langsung','kalimat objektif menjadi subjektif','kalimat aktif menjadi kalimat berita'],a:1,e:'Tanda petik dihilangkan dan dipakai konjungsi “bahwa” → kalimat tidak langsung.'},
 {q:'Kalimat 1: Aktifitas evakuasi dilakukan oleh tim SAR selama dua jam.<br>Kalimat 2: Aktivitas evakuasi dilakukan oleh tim SAR selama dua jam.<br>Jika berita harus memakai kaidah bahasa Indonesia, perbaikan yang tepat ….',o:['Kalimat 1 karena lebih umum dipakai masyarakat','Kalimat 2 karena memakai bentuk kata baku','Kalimat 1 karena lebih singkat','Kedua kalimat sama-sama tepat'],a:1,e:'Bentuk baku menurut KBBI adalah “aktivitas”, bukan “aktifitas”.'},
 {q:'<div class="qtext"><b>Warga Kota Batu Temukan Cara Baru Mengolah Sampah</b><br>Sejumlah warga menemukan metode baru untuk mengolah sampah rumah tangga … Kegiatan dilakukan pada Senin, 7 September 2026. Menurut koordinator kegiatan, metode tersebut masih dalam tahap pengembangan. Warga berharap metode itu dapat diterapkan lebih luas setelah pengujian lebih lanjut.</div>Untuk mengetahui siapa yang memberi informasi bahwa metode masih dalam pengembangan, bagian yang diperhatikan adalah ….',o:['Judul','Kutipan atau keterangan narasumber','Keterangan tempat','Kata kerja dalam berita'],a:1,e:'Siapa yang menyampaikan informasi (atribusi) terlihat dari keterangan narasumber.'},
 {q:'Seorang siswa menilai apakah berita dapat dipercaya: (1) membaca judul, (2) memeriksa penerbit, (3) memeriksa tanggal publikasi, (4) memeriksa data dan fakta, (5) mencari sumber lain sebagai pembanding. Langkah itu paling tepat menunjukkan ….',o:['proses menentukan struktur berita','proses menemukan unsur kebahasaan','proses mengecek keakuratan berita','proses menentukan judul berita'],a:2,e:'Memeriksa sumber, tanggal, data, dan membandingkan adalah proses cek akurasi/verifikasi.'},
 {q:'Berita X terbit 8 September 2026 dan melaporkan peristiwa hari yang sama. Berita itu mencantumkan nama narasumber, data jumlah peserta, lokasi, waktu kejadian, dan bisa dibandingkan dengan laporan media lain yang serupa. Kesimpulan paling tepat ….',o:['Berita X hanya dapat disebut aktual karena terbit hari yang sama','Berita X hanya dapat disebut akurat karena punya narasumber','Berita X menunjukkan ciri aktual dan memiliki unsur pendukung keakuratan','Berita X tidak dapat dipercaya karena memakai data angka'],a:2,e:'Terbit di hari kejadian = aktual; narasumber, data, dan pembanding = pendukung akurasi.'},
 {q:'Teks berita masa kini sering disajikan secara multimodal dalam bentuk vlog. Keunggulan utama vlog dibandingkan berita cetak biasa adalah ….',o:['Penonton tidak perlu memikirkan 5W+1H karena digantikan gambar','Penonton dapat melihat langsung situasi peristiwa lewat visual dan audio yang nyata','Pembuat berita bebas beropini tanpa riset fakta','Vlog tidak memerlukan naskah maupun penyuntingan'],a:1,e:'Kekuatan vlog: gabungan visual dan audio yang menampilkan situasi langsung.'},
 {q:'Seorang siswa merekam vlog liputan pameran seni di alun-alun Kota Batu. Saat ditonton ulang, penjelasannya tak terdengar jelas karena tertutup suara kendaraan. Siswa itu mengabaikan faktor ….',o:['Pemilihan tema yang menarik dan relevan','Penggunaan gambar visual yang proporsional dan stabil','Penggunaan audio yang jelas dan jernih','Penampilan fisik dan pencahayaan lokasi syuting'],a:2,e:'Masalahnya ada pada kejelasan audio.'},
 {q:'Meskipun berformat video kekinian, naravlog berita tetap menjaga profesionalisme jurnalistik. Cara berkomunikasi yang paling tepat ….',o:['Memakai bahasa gaul agar terasa seperti mengobrol dengan teman','Memakai bahasa baku dengan intonasi dan artikulasi yang jelas','Berbicara sangat cepat agar durasi video singkat','Memakai bahasa daerah secara dominan agar unik'],a:1,e:'Bahasa baku, intonasi, dan artikulasi jelas menjaga kejelasan dan kredibilitas.'},
 {q:'Sebuah vlog berita meliput jalanan rusak di sebuah desa, tetapi gambarnya sangat buram, kamera sering bergoyang, dan tidak fokus pada objek jalan. Dampak paling mungkin bagi penonton ….',o:['Penonton lebih fokus mendengarkan suara pembawa berita','Penonton menganggap video dramatis dan artistik','Penonton tetap mendapat kelengkapan 5W+1H secara utuh','Penonton kesulitan memahami konteks lokasi dan merasa pusing atau tidak nyaman'],a:3,e:'Gambar buram dan goyang menyulitkan pemahaman serta membuat tidak nyaman.'},
 {q:'Langkah pertama sebelum memproduksi vlog berita adalah menentukan tema. Tema yang layak dipublikasikan sebaiknya ….',o:['Mengandung informasi faktual yang bermanfaat sekaligus mengedukasi masyarakat','Berisi opini atau asumsi pribadi untuk memicu perdebatan','Membahas gosip tokoh publik yang viral walau belum terbukti','Menceritakan keseharian pembuat video yang tak terkait kepentingan publik'],a:0,e:'Tema vlog berita harus faktual, bermanfaat, dan mengedukasi.'}
];
var QS={i:0,score:0,ans:null,done:false,started:false};
function renderQuiz(){
  var el=document.getElementById('quizBox'); if(!el) return;
  if(!QS.started){
    el.innerHTML='<div class="dark"><b>Siap uji kemampuan?</b><p style="margin:.3em 0 0">25 soal pilihan ganda tentang teks berita &amp; vlog. Tiap soal langsung ada pembahasan. Santai saja, ini buat latihan!</p></div><button class="btn red" data-act="qstart">MULAI KUIS</button>'; return;
  }
  if(QS.done){
    var n=Math.round(QS.score/Q.length*100), k=n>=88?'Sangat Baik 🏆':n>=75?'Baik 👍':n>=60?'Cukup 🙂':'Perlu belajar lagi 💪';
    el.innerHTML='<div class="score"><div>Skor kamu</div><div class="n">'+n+'</div><p><b>'+QS.score+' / '+Q.length+' benar</b><br>'+k+'</p></div><div class="row" style="justify-content:center"><button class="btn" data-act="qretry">Ulangi kuis</button><button class="btn ghost" data-go="definisi">Baca materi lagi</button></div>'; return;
  }
  var q=Q[QS.i], L='ABCD';
  el.innerHTML='<div class="qno">Soal '+(QS.i+1)+' dari '+Q.length+'</div><div class="qbar"><i style="width:'+(QS.i/Q.length*100)+'%"></i></div><div class="mq"><p>'+q.q+'</p>'+
   q.o.map(function(o,j){return '<button class="opt" data-act="qans" data-j="'+j+'"><b>'+L[j]+'.</b> '+o+'</button>'}).join('')+'<div class="fb" id="qfb"></div></div><div class="row"><button class="btn" id="qnext" data-act="qnext" style="display:none">'+(QS.i===Q.length-1?'Lihat skor':'Soal berikutnya ▶')+'</button></div>';
}
add('kuis','Kuis','Kuis: Ujian Harian',
 banner('🧠','Kuis Teks Berita & Vlog','Ujian harian · 25 soal')+'<div id="quizBox"></div>');

 '<div class="row" style="margin-top:1em"><button class="btn ghost sm" data-act="reset">Hapus semua jawabanku</button><button class="btn sm" data-go="cover">Kembali ke sampul</button></div>');

/* ===== Mesin tampilan ===== */
var cur=0, $s=document.getElementById('scroll');
function esc(s){return s}
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(function(){t.classList.remove('show')},1400); }
function restore(){
  $s.querySelectorAll('[data-save]').forEach(function(el){
    var v=state[el.getAttribute('data-save')];
    if(v===undefined) return;
    if(el.type==='checkbox') el.checked=!!v; else el.value=v;
  });
}
function show(i,keep){
  cur=Math.max(0,Math.min(P.length-1,i));
  var p=P[cur];
  $s.innerHTML='<div class="pg">'+p.html+'</div>';
  restore();
  if(p.id==='kuis') renderQuiz();
  if(!keep) $s.scrollTop=0;
  document.getElementById('prog').style.width=((cur+1)/P.length*100)+'%';
  document.getElementById('mid').textContent=(cur+1)+' / '+P.length+' · '+p.title;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===P.length-1;
  try{ history.replaceState(null,'','#'+p.id); }catch(e){}
  buildMenu();
}
function goId(id){ for(var i=0;i<P.length;i++) if(P[i].id===id){ show(i); return; } }
function buildMenu(){
  var h='',g='';
  P.forEach(function(p,i){ if(p.grp!==g){ g=p.grp; h+='<div class="grp">'+g+'</div>'; } h+='<button data-i="'+i+'" class="'+(i===cur?'cur':'')+'"><span>'+(i+1)+'.</span><span>'+p.title+'</span></button>'; });
  document.getElementById('lst').innerHTML=h;
}
var PY=[
 ['Judul','Menarik perhatian sekaligus mewakili isi. Singkat, padat, jelas (sekitar 3–8 kata). Judul berlebihan atau tak sesuai isi menurunkan kepercayaan pembaca.'],
 ['Kepala berita (teras)','Memuat inti peristiwa: apa, siapa, di mana, kapan. Biasanya satu kalimat ringkas, sekitar 20–35 kata.'],
 ['Leher berita','Jembatan antara teras dan tubuh berita. Mengembangkan dan menguatkan kepala berita dengan keterangan tambahan.'],
 ['Tubuh berita','Memuat kronologi, latar belakang, dan kutipan narasumber; menjawab mengapa dan bagaimana. Disusun berurutan menurut waktu.'],
 ['Kaki berita','Keterangan pelengkap yang tetap berguna, tetapi tidak merusak pemahaman bila dihilangkan. Boleh dipotong jika ruang terbatas.']];

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-act],#prev,#next,#menuBtn,#closeMenu,#lst button');
  if(!t) return;
  if(t.id==='prev') return show(cur-1);
  if(t.id==='next') return show(cur+1);
  if(t.id==='menuBtn'){ document.getElementById('drawer').classList.add('open'); return; }
  if(t.id==='closeMenu'){ document.getElementById('drawer').classList.remove('open'); return; }
  if(t.closest('#lst')){ document.getElementById('drawer').classList.remove('open'); return show(+t.getAttribute('data-i')); }
  if(t.hasAttribute('data-go')) return goId(t.getAttribute('data-go'));
  var a=t.getAttribute('data-act');
  if(a==='acc'){ var b=t.parentNode; b.classList.toggle('open'); t.setAttribute('aria-expanded',b.classList.contains('open')); }
  else if(a==='flip'){ t.classList.toggle('open'); }
  else if(a==='rev'){ t.nextElementSibling.classList.toggle('show'); }
  else if(a==='hl'){ var k=t.getAttribute('data-k'); document.querySelectorAll('.hl-'+k).forEach(function(x){x.classList.toggle('on')}); }
  else if(a==='pyr'){
    var i=+t.getAttribute('data-i'); document.querySelectorAll('#pyr button').forEach(function(b){b.classList.remove('on')}); t.classList.add('on');
    document.getElementById('pinfo').innerHTML='<div class="t">'+PY[i][0]+'</div>'+PY[i][1];
  }
  else if(a==='mq'){
    var box=t.closest('.mq'); var ok=t.getAttribute('data-c')==='1';
    box.querySelectorAll('.opt').forEach(function(b){ b.disabled=true; if(b.getAttribute('data-c')==='1') b.classList.add('ok'); });
    if(!ok) t.classList.add('no');
    var fb=box.querySelector('.fb'); fb.classList.add('show'); fb.innerHTML=(ok?'✅ <b>Tepat!</b> ':'❌ <b>Belum tepat.</b> ')+box.getAttribute('data-exp');
  }
  else if(a==='qstart'){ QS={i:0,score:0,ans:null,done:false,started:true}; renderQuiz(); }
  else if(a==='qretry'){ QS={i:0,score:0,ans:null,done:false,started:true}; renderQuiz(); $s.scrollTop=0; }
  else if(a==='qans'){
    var j=+t.getAttribute('data-j'), q=Q[QS.i], ok2=j===q.a;
    if(ok2) QS.score++;
    document.querySelectorAll('#quizBox .opt').forEach(function(b,x){ b.disabled=true; if(x===q.a) b.classList.add('ok'); });
    if(!ok2) t.classList.add('no');
    var f=document.getElementById('qfb'); f.classList.add('show'); f.innerHTML=(ok2?'✅ <b>Benar!</b> ':'❌ <b>Kurang tepat.</b> Jawaban: <b>'+'ABCD'[q.a]+'</b>. ')+q.e;
    document.getElementById('qnext').style.display='inline-block';
  }
  else if(a==='qnext'){ if(QS.i===Q.length-1) QS.done=true; else QS.i++; renderQuiz(); $s.scrollTop=0; }
  else if(a==='reset'){ if(confirm('Hapus semua jawaban yang sudah kamu isi?')){ state={}; persist(); show(cur,true); toast('Jawaban dihapus'); } }
});
document.addEventListener('input',function(e){
  var el=e.target; if(!el.hasAttribute||!el.hasAttribute('data-save')) return;
  state[el.getAttribute('data-save')]=el.type==='checkbox'?el.checked:el.value;
  clearTimeout(document._st); document._st=setTimeout(function(){persist();toast('Jawabanmu tersimpan ✓')},500);
});
document.addEventListener('keydown',function(e){
  if(/INPUT|TEXTAREA/.test((e.target.tagName||''))) return;
  if(e.key==='ArrowRight') show(cur+1); else if(e.key==='ArrowLeft') show(cur-1); else if(e.key==='Escape') document.getElementById('drawer').classList.remove('open');
});
var start=0, h=(location.hash||'').replace('#','');
for(var i=0;i<P.length;i++) if(P[i].id===h) start=i;
show(start);
</script>
